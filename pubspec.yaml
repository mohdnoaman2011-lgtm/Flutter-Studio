name: flutter_studio
description: Create, edit and build Flutter projects with GitHub.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.2.0
  url_launcher: ^6.3.0
  archive: ^3.6.1
  path_provider: ^2.1.0
  share_plus: ^10.1.0
  google_fonts: ^6.2.1
  open_filex: ^4.5.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#F2F5FA"
  adaptive_icon_foreground: assets/icon/icon_foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png
